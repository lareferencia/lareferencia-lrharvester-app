#harvester config
harvester.max.retries = 10
harvester.retry.seconds = 3
harvester.retry.factor = 2

# set sizes according to #repositories
scheduler.pool.size = 10
taskexecutor.pool.size = 10

# Reconciliacion de reservas y retencion; el despacho se dispara al terminar cada worker
taskmanager.reconcile.interval-ms = 2000
taskmanager.concurrent.tasks = 4
taskmanager.max-queued-tasks = 32
# Alias legacy aceptado: taskmanager.max_queuded.tasks (no definir valores distintos)
taskmanager.result-retention-seconds = 3600
taskmanager.max-retained-results = 1000
taskmanager.shutdown-timeout-seconds = 30

#reponame e instname
reponame.fieldname=dc:source
reponame.prefix=reponame:

instname.fieldname=dc:source
instname.prefix=instname: