# Local PostgreSQL identity store, JDBC sessions, and scoped API tokens.
security.api-v5.allowed-origins=
security.api-v5.page-size-max=200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
api-v5.attribute-profiles-location=file:config/attribute-profiles
springdoc.api-docs.path=/api/v5/openapi
springdoc.swagger-ui.path=/api/v5/docs
springdoc.paths-to-match=/api/v5/**
springdoc.packages-to-scan=org.lareferencia.backend.api.v5
