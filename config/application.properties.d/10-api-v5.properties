# Local PostgreSQL identity store, JDBC sessions, and scoped API tokens.
security.api-v5.allowed-origins=
security.api-v5.page-size-max=200

# Browser authentication uses two cookies: CSRF (XSRF-TOKEN) and session.
# Distributed defaults support development over HTTP, including remote IPs.
# For HTTPS deployments (including HTTPS at a reverse proxy), set BOTH flags
# below to true and restart Harvester. A Secure CSRF cookie is not sent over
# HTTP, so enabling only that flag will prevent HTTP login.
security.api-v5.cookies-secure=false
server.servlet.session.cookie.secure=false

# Keep the session cookie HttpOnly for both HTTP development and HTTPS.
# This flag does not control the CSRF cookie and does not prevent login.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
api-v5.attribute-profiles-location=file:config/attribute-profiles
springdoc.api-docs.path=/api/v5/openapi
springdoc.swagger-ui.path=/api/v5/docs
springdoc.paths-to-match=/api/v5/**
springdoc.packages-to-scan=org.lareferencia.backend.api.v5
